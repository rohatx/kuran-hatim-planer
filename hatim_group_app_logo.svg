<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg" style="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Logo für eine Hatim-Gruppen-App</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Dunkelgrünes App-Icon mit einem Ring aus 30 goldenen Segmenten für die 30 Cüz und einem offenen Buch in der Mitte. Zwei Segmente leuchten heller und stehen für die zwei Cüz pro Monat.</desc><rect x="190" y="50" width="300" height="300" rx="64" fill="#0F5C4D" style="fill:rgb(15, 92, 77);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="340" cy="200" r="108" fill="none" stroke="#E8C468" stroke-width="12" stroke-dasharray="16 7.04" transform="rotate(-90 340 200)" opacity="0.55" style="fill:none;stroke:rgb(232, 196, 104);color:rgb(11, 11, 11);stroke-width:12px;stroke-dasharray:16px, 7.04px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.55;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><circle cx="340" cy="200" r="108" fill="none" stroke="#F6E3A1" strok